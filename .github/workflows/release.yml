name: Desktop release

# Pushing a v* tag builds the desktop app for macOS, Windows and Linux and attaches the installers to a
# draft GitHub Release for the owner to review and publish. Running it by hand only builds (artifacts on the run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: --mac dmg --arm64 --x64
          - os: windows-latest
            targets: --win nsis --x64
          - os: ubuntu-latest
            targets: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          DESKTOP_BUILD: "1"
      - run: npm ci
        working-directory: desktop
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run prepare-server
        working-directory: desktop
      - run: npx electron-builder ${{ matrix.targets }} --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      # Not marked as a pre-release: the landing page links to releases/latest, which skips pre-releases.
      - run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "GameDev Studio $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
